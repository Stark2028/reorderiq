[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reorderiq"
version = "0.2.0"
description = "Chronological buyer reorder prediction and evidence-driven historical replay"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "pyarrow>=19,<26", "openpyxl>=3.1,<4", "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "threadpoolctl>=3,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "playwright>=1.50,<2"]
reports = ["matplotlib>=3.9,<4"]

[project.scripts]
reorderiq = "reorderiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reorderiq = ["sql/*.sql", "web/*.html", "web/fonts/*", "web/ui/index.html", "web/ui/assets/*", "web/ui/licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
